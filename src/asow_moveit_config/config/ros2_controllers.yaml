# This config file is used by ros2_control

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


left_arm_controller:
  ros__parameters:
    joints:
      - base_link-v1_linkL1
      - link_L_1-v1_linkL2
      - link_L_2-v1_linkL3
      - link_L_3-v1_linkL4
      - link_L_4-v1_linkL5

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity


right_arm_controller:
  ros__parameters:
    joints:
      - base_link-v1_linkR1
      - link_R_1-v1_linkR2
      - link_R_2-v1_linkR3
      - link_R_3-v1_linkR4
      - link_R_4-v1_linkR5

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity
